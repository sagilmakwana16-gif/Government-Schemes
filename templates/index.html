<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Government Scheme Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #chat-container {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Government Header */
        #chat-header {
            background: linear-gradient(90deg, #0b5ed7, #198754);
            color: white;
            padding: 18px;
            text-align: center;
            font-weight: bold;
            font-size: 22px;
        }

        #chat-header small {
            display: block;
            font-size: 13px;
            margin-top: 5px;
            font-weight: normal;
        }

        #chat-box {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #f8fafc;
        }

        .message {
            max-width: 75%;
            padding: 11px 15px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.5;
        }

        /* User Message */
        .user-message {
            background-color: #0b5ed7;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        /* Bot Message */
        .bot-message {
            background-color: #e8f5e9;
            color: #1b1b1b;
            align-self: flex-start;
            border-left: 4px solid #198754;
            border-bottom-left-radius: 3px;
        }

        #input-container {
            display: flex;
            border-top: 1px solid #ddd;
            padding: 12px;
            background: #ffffff;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        #user-input:focus {
            border-color: #0b5ed7;
            box-shadow: 0 0 4px rgba(11, 94, 215, 0.3);
        }

        /* Send Button */
        #send-btn {
            background-color: #198754;
            color: white;
            border: none;
            padding: 12px 22px;
            margin-left: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        #send-btn:hover {
            background-color: #146c43;
        }

        #send-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div id="chat-container">

        <div id="chat-header">
            Government Scheme Assistant
            <small>Government Yojana Information Chatbot</small>
        </div>

        <div id="chat-box">
            <div class="message bot-message">
                Hello! Welcome to Government Scheme Assistant.
                <br>
                I can help you with information about government schemes and yojanas.
            </div>
        </div>

        <div id="input-container">

            <input
                type="text"
                id="user-input"
                placeholder="Ask about a government scheme..."
                autocomplete="off"
            >

            <button id="send-btn">
                Send
            </button>

        </div>

    </div>


    <script>

        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");


        function appendMessage(text, sender) {

            const messageDiv = document.createElement("div");

            messageDiv.classList.add(
                "message",
                sender === "user"
                    ? "user-message"
                    : "bot-message"
            );

            messageDiv.textContent = text;

            chatBox.appendChild(messageDiv);

            chatBox.scrollTop = chatBox.scrollHeight;
        }


        async function sendMessage() {

            const messageText = userInput.value.trim();

            if (!messageText) {
                return;
            }

            appendMessage(messageText, "user");

            userInput.value = "";

            sendBtn.disabled = true;

            try {

                const response = await fetch("/get_response", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: messageText
                    })
                });


                if (!response.ok) {

                    throw new Error(
                        `HTTP error: ${response.status}`
                    );

                }


                const data = await response.json();


                appendMessage(
                    data.reply,
                    "bot"
                );


            } catch (error) {

                console.error("Error:", error);

                appendMessage(
                    "Sorry, something went wrong. Please try again.",
                    "bot"
                );

            } finally {

                sendBtn.disabled = false;

                userInput.focus();

            }
        }


        sendBtn.addEventListener(
            "click",
            sendMessage
        );


        userInput.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {
                    sendMessage();
                }

            }
        );

    </script>

</body>

</html>
